name: Build Native iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies & Prepare iOS Bundle
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios @capacitor/local-notifications
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp style.css www/ 2>/dev/null || true
          cp app.js www/ 2>/dev/null || true
          cp logo_padded.png www/ 2>/dev/null || true
          cp som.mp3 www/ 2>/dev/null || true
          npx cap add ios || true
          npx cap copy ios || true
          npx cap sync ios || true

      - name: Inject Full iOS AppIcon & Build IPA
        run: |
          cd ios/App
          rm -rf App/Assets.xcassets/AppIcon.appiconset
          cp -r ../../AppIcon.appiconset App/Assets.xcassets/AppIcon.appiconset
          
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO || true
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/Ticto.app || cp -r App.xcarchive/Products/Applications/*.app Payload/Ticto.app || true
          zip -r Ticto.ipa Payload
          echo "IPA Native Build Finished with Full AppIcon!"

      - name: Upload Ticto.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ticto-Native-iOS-App
          path: ios/App/Ticto.ipa
